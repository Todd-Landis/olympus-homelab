<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f5f5f2">
<title>Network · Olympus</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='3' y='3' width='26' height='26' rx='8' fill='%2317181b'/><circle cx='16' cy='16' r='6.5' fill='none' stroke='%23f5f5f2' stroke-width='2'/><path d='M9.5 16h13M16 9.5c2.5 3 2.5 10 0 13M16 9.5c-2.5 3-2.5 10 0 13' stroke='%23f5f5f2' stroke-width='1.6' fill='none'/></svg>">
<link rel="stylesheet" href="/suite.css">
<style>
  .desk { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; }
  .desk .status { font-size: 13px; color: var(--muted); margin-right: auto; }
  .desk .status.err { color: var(--bad-ink); }
  .tabs { display: flex; gap: 22px; margin: 16px 0 18px; box-shadow: inset 0 -1px var(--line); overflow-x: auto; scrollbar-width: none; }
  .tabs button { font: 500 14px var(--sans); color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 0 10px; cursor: pointer; white-space: nowrap; transition: color 150ms ease; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--text); }
  .tabs button kbd { margin-left: 6px; font-size: 10px; padding: 0 4px; }
  .plaques { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
  .plaque { padding: 14px 16px; }
  .plaque .l { font-size: 12.5px; color: var(--muted); }
  .plaque .n { font: 600 26px/1.2 var(--sans); letter-spacing: -.022em; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .plaque .n small { font: 500 14px var(--sans); color: var(--muted); letter-spacing: 0; }
  h3.t { font: 600 15px var(--sans); letter-spacing: -.006em; margin: 28px 0 10px; display: flex; gap: 8px; align-items: baseline; }
  h3.t small { font: 400 13px var(--sans); color: var(--muted); letter-spacing: 0; }
  .chartcard { padding: 14px 14px 10px; }
  /* the shared chart palette: allowed = slot 1 blue, blocked = slot 2 orange stacked on top, a white gap between */
  .colbars { display: flex; align-items: flex-end; justify-content: space-between; gap: 3px; height: 140px; }
  .colbars .b { flex: 1; max-width: 24px; display: flex; flex-direction: column; justify-content: flex-end; gap: 1px; height: 100%; min-width: 3px; }
  .colbars .q { background: #2a78d6; }
  .colbars .x { background: #eb6834; }
  .colbars .b > :first-child { border-radius: 3px 3px 0 0; }
  .axis { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }
  .two { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); align-items: start; }
  .tablecard { padding: 4px 8px; }
  .site { font-weight: 500; overflow-wrap: anywhere; }
  .chipdev { display: inline-block; font: 500 11.5px/1.6 var(--sans); padding: 0 8px; border-radius: 99px; background: var(--surface-3); color: var(--text-2); margin: 1px 3px 1px 0; white-space: nowrap; }
  .day { font: 600 13px var(--sans); color: var(--text-2); margin: 24px 0 8px; }
  .when { font: 13px var(--sans); font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; width: 1%; }
  .devrow .sub { font: 11.5px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
  .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .leaders li[data-site] { cursor: pointer; }
  /* switches that change the network for everyone: the whole card is the target, the switch says the state */
  .switches { display: grid; gap: 10px 14px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); margin-top: 14px; }
  .swcard { display: flex; align-items: center; gap: 14px; padding: 11px 14px 11px 16px; cursor: pointer; -webkit-user-select: none; user-select: none; }
  .swcard:has(.switch:disabled) { cursor: default; }
  .swcard .tx { flex: 1; min-width: 0; }
  .swcard .l { font: 500 13.5px/1.35 var(--sans); }
  .swcard .s { font-size: 12.5px; color: var(--muted); }
  .swcard .s.err { color: var(--bad-ink); }
  @media (max-width: 760px) { .when { white-space: normal; width: auto; min-width: 84px; } }  /* the time wraps so the numbers keep their room */
  @media (hover: hover) and (pointer: fine) {
    .tabs button:hover { color: var(--text); }
    .colbars .b:hover .q { background: #256abf; }
    .colbars .b:hover .x { background: #d45a2a; }
    .leaders li[data-site]:hover .name { color: var(--accent-ink); }
    .swcard:hover .switch:not(:disabled) { background-color: rgba(23, 24, 28, .56); }
    .swcard:hover .switch[aria-checked="true"]:not(:disabled) { background-color: #256abf; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="masthead"></div>
  <div class="desk">
    <span id="status" class="status">Loading…</span>
    <select id="hours" aria-label="Time range">
      <option value="24">Last 24 hours</option><option value="72">Last 3 days</option><option value="168">Last 7 days</option><option value="720">Last 30 days</option>
    </select>
    <select id="device" aria-label="Device"><option value="">All devices</option></select>
    <select id="wifi" aria-label="Wi-Fi network" hidden><option value="">All Wi-Fi networks</option></select>
    <label class="chk"><input type="checkbox" id="noise" checked> Hide background</label>
  </div>
  <section class="switches" aria-label="Network switches">
    <div class="card swcard" data-sw="filter">
      <div class="tx"><div class="l" id="sw-filter-l">Adult-site filter</div><div class="s" id="sw-filter-s">Checking…</div></div>
      <button class="switch" id="sw-filter" role="switch" aria-checked="false" aria-labelledby="sw-filter-l" aria-describedby="sw-filter-s" disabled></button>
    </div>
    <div class="card swcard" data-sw="incognito">
      <div class="tx"><div class="l" id="sw-incognito-l">Incognito</div><div class="s" id="sw-incognito-s">Checking…</div></div>
      <button class="switch" id="sw-incognito" role="switch" aria-checked="false" aria-labelledby="sw-incognito-l" aria-describedby="sw-incognito-s" disabled></button>
    </div>
  </section>
  <nav class="tabs" id="tabs">
    <button data-tab="overview" class="on">Overview<kbd>1</kbd></button>
    <button data-tab="sites">Sites<kbd>2</kbd></button>
    <button data-tab="timeline">Timeline<kbd>3</kbd></button>
    <button data-tab="blocked">Blocked<kbd>4</kbd></button>
    <button data-tab="blocklist">Your blocks<kbd>5</kbd></button>
  </nav>
  <main id="view"></main>
</div>

<div class="drawer" id="drawer"><div class="sheet" role="dialog" aria-label="Site details"><div class="sheet-head"><h3 id="sheet-title"></h3><span id="sheet-actions"></span><button class="x" data-close aria-label="Close">×</button></div><div class="sheet-body" id="sheet" tabindex="0" role="region" aria-label="Site details"></div></div></div>

<script src="/suite.js"></script>
<script>
const { esc, toast, tween } = Suite;
const $ = (s) => document.querySelector(s);
const N = (n) => (n ?? 0).toLocaleString();
const fmtTime = (t) => new Date(t * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const fmtDay = (t) => new Date(t * 1000).toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
const fmtWhen = (t) => { const d = new Date(t * 1000); return d.toDateString() === new Date().toDateString() ? fmtTime(t) : d.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); };
const ago = (t) => { const s = Date.now() / 1000 - t; if (s < 90) return "just now"; if (s < 3600) return Math.round(s / 60) + " min ago"; if (s < 86400) return Math.round(s / 3600) + " h ago"; return Math.round(s / 86400) + " d ago"; };
const span = (a, b) => (b - a < 60 ? fmtTime(a) : `${fmtTime(a)}–${fmtTime(b)}`);
const tw = (key, v) => `<span data-tw="${esc(key)}" data-v="${v}">${N(v)}</span>`;
const TABS = ["overview", "sites", "timeline", "blocked", "blocklist"];
const TAB_NAMES = { overview: "Overview", sites: "Sites", timeline: "Timeline", blocked: "Blocked lookups", blocklist: "Your blocks" };

let tab = "overview";
const prefs = (() => { try { return JSON.parse(localStorage.getItem("nw-prefs") || "{}"); } catch { return {}; } })();
if (prefs.hours) $("#hours").value = prefs.hours;
if (prefs.noise === false) $("#noise").checked = false;
if (TABS.includes(prefs.tab)) tab = prefs.tab;
function savePrefs() { try { localStorage.setItem("nw-prefs", JSON.stringify({ hours: $("#hours").value, noise: $("#noise").checked, tab, device: $("#device").value, wifi: $("#wifi").value })); } catch {} }
const qs = (extra = {}) => new URLSearchParams({ hours: $("#hours").value, device: $("#device").value, wifi: $("#wifi").value, noise: $("#noise").checked ? "1" : "0", ...extra }).toString();
async function api(path, opts) { const r = await fetch(path, opts); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.statusText); return j; }
const post = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });

async function block(domain, scope, btn) {
  const what = scope === "exact" ? domain : `${domain} and all its subdomains`;
  if (!confirm(`Block ${what} for every device?`)) return;
  if (btn) btn.disabled = true;
  try { await post("/api/block", { domain, scope }); toast(`Blocked ${domain}${scope === "exact" ? "" : " (whole site)"}`); lastView = ""; render(); }
  catch (e) { toast("Couldn't block: " + e.message); if (btn) btn.disabled = false; }
}
async function unblock(kind, domain, btn) {
  if (!confirm(`Unblock ${prettyRegex(domain)}?`)) return;
  btn.disabled = true;
  try { await post("/api/unblock", { kind, domain }); toast("Unblocked"); lastView = ""; render(); }
  catch (e) { toast("Couldn't unblock: " + e.message); btn.disabled = false; }
}

// ------------------------------------------------------------------ switches: the adult-site filter and Incognito
// Both change Pi-hole for every device. The switch moves when Pi-hole has made the change, not before.
let controls = null, controlsErr = "", controlsAt = 0;
const swBusy = {};
const SW_NAME = { filter: "the adult-site filter", incognito: "Incognito" };
async function loadControls() {
  if (Object.keys(swBusy).length) return;  // a change is on its way; its answer is fresher
  try { controls = await api("/api/controls"); controlsErr = ""; }
  catch (e) { controlsErr = e.message; }
  controlsAt = Date.now();
  drawControls();
}
function drawControls() {
  const c = controls;
  const set = (key, on, sub, usable) => {
    const b = $("#sw-" + key), s = $("#sw-" + key + "-s");
    b.setAttribute("aria-checked", String(!!on));
    b.setAttribute("aria-busy", String(!!swBusy[key]));
    b.disabled = !usable;
    s.textContent = swBusy[key] || (controlsErr ? `Couldn't check Pi-hole: ${controlsErr}` : sub);
    s.classList.toggle("err", !swBusy[key] && !!controlsErr);
  };
  if (!c) { set("filter", false, "Checking…", false); set("incognito", false, "Checking…", false); return; }
  const f = c.filter, i = c.incognito, ok = !controlsErr;
  set("filter", f.on, !f.installed ? "Not set up yet: run ./deploy.sh adult once" : f.on ? `Blocking ${N(f.sites)} adult sites on every device` : "Off: adult sites load on every device", ok && f.installed);
  set("incognito", i.on, i.on ? `Not recording lookups${i.since ? " since " + fmtWhen(i.since) : ""}` : "Off: every lookup is recorded", ok);
}
async function flip(key, viaKeyboard) {
  if (!controls || swBusy[key] || controlsErr || (key === "filter" && !controls.filter.installed)) return;
  const on = !controls[key].on;
  const ask = key === "filter"
    ? (on ? null : "Turn off the adult-site filter? Adult sites will load on every device until you turn it back on.")
    : on ? "Turn on Incognito? Pi-hole stops recording lookups from every device until you turn it off, so nothing from that time shows here or in Pi-hole. Blocking keeps working."
      : "Turn off Incognito? Pi-hole restarts to record again, so the internet pauses for every device for a few seconds.";
  if (ask && !confirm(ask)) return;
  swBusy[key] = on ? "Turning on…" : key === "incognito" ? "Turning off: Pi-hole is restarting…" : "Turning off…";
  drawControls();
  try {
    const c = await post("/api/" + key, { on });
    delete swBusy[key];
    const apply = () => { controls = c; controlsErr = ""; controlsAt = Date.now(); drawControls(); };
    viaKeyboard ? Suite.instant($("#sw-" + key), apply) : apply();  // keyboard: no slide
    toast(key === "filter" ? (on ? `Adult-site filter on: blocking ${N(c.filter.sites)} sites` : "Adult-site filter off")
      : on ? "Incognito on: lookups aren't recorded" : "Incognito off: recording lookups again");
    refreshStatus();
  } catch (e) {
    delete swBusy[key]; drawControls();
    toast(`Couldn't turn ${on ? "on" : "off"} ${SW_NAME[key]}: ${e.message}`);
  }
}
const prettyRegex = (r) => { const m = /^\(\\\.\|\^\)(.+)\$$/.exec(r); return m ? m[1].replace(/\\\./g, ".") : r; };
const pills = (devs) => Object.entries(devs).sort((a, b) => b[1] - a[1]).map(([n]) => `<span class="chipdev">${esc(n)}</span>`).join("");

// ------------------------------------------------------------------ views
const views = {
  async overview() {
    const s = await api("/api/summary?" + qs());
    const max = Math.max(1, ...s.series.map((p) => p.queries));
    const bars = s.series.map((p) => `<div class="b" title="${fmtWhen(p.t)}: ${N(p.queries)} lookups, ${N(p.blocked)} blocked">
        ${p.blocked ? `<div class="x" style="height:${(p.blocked / max * 100).toFixed(1)}%"></div>` : ""}<div class="q" style="height:${((p.queries - p.blocked) / max * 100).toFixed(1)}%"></div></div>`).join("");
    const pct = s.queries ? Math.round(100 * s.blocked / s.queries) : 0;
    return `<div class="grid plaques">
        <div class="card plaque"><div class="l">Lookups</div><div class="n">${tw("q", s.queries)}</div></div>
        <div class="card plaque"><div class="l">Blocked</div><div class="n">${tw("b", s.blocked)} <small>${pct}%</small></div></div>
        <div class="card plaque"><div class="l">Unique sites</div><div class="n">${tw("s", s.sites)}</div></div>
        <div class="card plaque"><div class="l">Devices</div><div class="n">${tw("d", s.devices.length)}</div></div></div>
      <h3 class="t">Activity <small>${s.bucket === 3600 ? "per hour" : "per day"}</small></h3>
      <div class="card chartcard"><div class="colbars">${bars}</div>
        <div class="axis"><span>${s.series[0] ? fmtWhen(s.series[0].t) : ""}</span><span>${s.series.at(-1) ? fmtWhen(s.series.at(-1).t) : ""}</span></div>
        <div class="legend"><span><i style="background:#2a78d6"></i>Allowed</span><span><i style="background:#eb6834"></i>Blocked</span></div></div>
      <div class="two">
        <div><h3 class="t">Devices</h3>
          ${s.devices.length ? `<div class="card tablecard"><table class="ledger"><tr><th>Device</th><th class="hide-sm">Wi-Fi</th><th class="r">Lookups</th><th class="r">Blocked</th><th class="r">Last seen</th></tr>
          ${s.devices.map((d) => `<tr class="click devrow" data-device="${esc(d.name)}" title="Show ${esc(d.name)}'s timeline"><td><span class="site">${esc(d.name)}</span><div class="sub">${d.ips.map(esc).join(" · ")}</div></td>
            <td class="hide-sm muted">${esc(d.wifi || "–")}</td><td class="r num">${N(d.queries)}</td><td class="r num">${N(d.blocked)}</td><td class="r muted">${ago(d.last)}</td></tr>`).join("")}</table></div>${lanInfo ? `<p class="muted" style="font-size:12.5px;margin:8px 2px 0">Home addresses in use: ${lanInfo.pool.in_use} of ${lanInfo.pool.size} (${Math.round(lanInfo.pool.pct)}%)${lanInfo.networks.length ? "" : " · Wi-Fi network shows once the router sends its log"}</p>` : ""}` : `<div class="empty">No devices in this range.</div>`}</div>
        <div><h3 class="t">Top sites</h3>
          ${s.top.length ? `<div class="card panel"><ul class="leaders">${s.top.map((t) => `<li data-site="${esc(t.base)}"><span class="name">${esc(t.base)}</span><span class="v">${N(t.n)}</span></li>`).join("")}</ul></div>` : `<div class="empty">Nothing yet.</div>`}</div>
      </div>`;
  },
  async sites() {
    const rows = await api("/api/sites?" + qs());
    return `<div class="toolbar"><h3 class="t" style="margin:0">${N(rows.length)} sites</h3>
      <input type="search" id="filter" placeholder="Filter sites…" style="flex:1;min-width:200px"></div>
      <div class="card tablecard"><table class="ledger" id="sitetable"><tr><th>Site</th><th class="hide-sm">Devices</th><th class="r">Lookups</th><th class="r">Last seen</th><th></th></tr>
      ${rows.map((r) => `<tr class="click" data-site="${esc(r.site)}"><td><span class="site">${esc(r.site)}</span>${r.blocked ? ` <span class="badge bad">${N(r.blocked)} blocked</span>` : ""}</td>
        <td class="hide-sm">${pills(r.devices)}</td><td class="r num">${N(r.queries)}</td><td class="r muted">${fmtWhen(r.last)}</td>
        <td class="r"><button class="btn danger" data-block="${esc(r.site)}">Block</button></td></tr>`).join("")}</table>
      ${rows.length ? "" : `<div class="empty">No sites in this range.</div>`}</div>`;
  },
  async timeline() {
    const visits = await api("/api/timeline?" + qs());
    if (!visits.length) return `<div class="empty">No activity in this range.</div>`;
    let out = "", day = "";
    for (const v of visits) {
      const d = fmtDay(v.start);
      if (d !== day) { if (day) out += "</table></div>"; day = d; out += `<div class="day">${esc(d)}</div><div class="card tablecard"><table class="ledger">`; }
      out += `<tr class="click" data-site="${esc(v.site)}"><td class="when">${span(v.start, v.end)}</td>
        <td><span class="site">${esc(v.site)}</span>${v.blocked ? ` <span class="badge bad">blocked</span>` : ""}</td>
        <td>${$("#device").value ? "" : `<span class="chipdev">${esc(v.device)}</span>`}</td><td class="r num muted">${N(v.queries)}</td></tr>`;
    }
    return out + "</table></div>" + (visits.length >= 4000 ? `<p class="muted">Showing the latest 4,000 visits.</p>` : "");
  },
  async blocked() {
    const rows = await api("/api/blocked?" + qs());
    const why = (s) => ({ GRAVITY: "Blocklist", GRAVITY_CNAME: "Blocklist", REGEX: "Your rule", REGEX_CNAME: "Your rule", DENYLIST: "Your rule", DENYLIST_CNAME: "Your rule" }[s] || s);
    return rows.length ? `<div class="card tablecard"><table class="ledger"><tr><th>Domain</th><th>Device</th><th class="r">Attempts</th><th class="r">Last</th><th class="hide-sm">Reason</th></tr>
      ${rows.map((r) => `<tr class="click" data-site="${esc(r.base)}"><td class="site">${esc(r.domain)}</td><td><span class="chipdev">${esc(r.device)}</span></td>
        <td class="r num">${N(r.n)}</td><td class="r muted">${fmtWhen(r.last)}</td><td class="hide-sm"><span class="badge plain">${esc(why(r.status))}</span></td></tr>`).join("")}</table></div>`
      : `<div class="empty">Nothing was blocked in this range.</div>`;
  },
  async blocklist() {
    const rows = await api("/api/blocklist");
    return `${rows.length ? `<div class="card tablecard"><table class="ledger"><tr><th>Rule</th><th class="hide-sm">Added</th><th></th></tr>
      ${rows.map((r) => `<tr><td><span class="site">${esc(r.kind === "regex" ? prettyRegex(r.domain) : r.domain)}</span>
          <div class="muted" style="font-size:12.5px">${r.kind === "regex" ? "Whole site" : "Exact name"}${r.comment ? " · " + esc(r.comment) : ""}${r.enabled ? "" : " · disabled"}</div></td>
        <td class="hide-sm muted">${r.added ? fmtWhen(r.added) : ""}</td><td class="r"><button class="btn" data-unblock="${esc(r.domain)}" data-kind="${r.kind}">Unblock</button></td></tr>`).join("")}</table></div>`
      : `<div class="empty">Nothing blocked yet. Use Block on any site, or search with Ctrl K.</div>`}
      <p class="muted" style="font-size:13px">Sites you've blocked manually. Ads and trackers blocked by Pi-hole's lists aren't shown here.</p>`;
  },
};

// ------------------------------------------------------------------ site details
let openSiteName = null, lastSheet = "";
async function openSite(site) {
  openSiteName = site; lastSheet = "";
  $("#sheet-title").textContent = site;
  $("#sheet-actions").innerHTML = `<button class="btn danger" data-block="${esc(site)}">Block whole site</button>`;
  $("#sheet").innerHTML = `<div class="empty">Loading…</div>`;
  $("#drawer").classList.add("open");
  await loadSite();
}
function closeSite() { openSiteName = null; $("#drawer").classList.remove("open"); }
async function loadSite() {
  const site = openSiteName;
  if (!site) return;
  try {
    const d = await api("/api/site?" + qs({ site }));
    if (site !== openSiteName) return;
    const html = `<h3 class="t" style="margin-top:0">Visits</h3>
      ${d.visits.length ? `<table class="ledger"><tr><th>When</th><th>Device</th><th class="r">Lookups</th></tr>
      ${d.visits.map((v) => `<tr><td class="when">${new Date(v.start * 1000).toLocaleDateString([], { month: "short", day: "numeric" })} · ${span(v.start, v.end)}</td>
        <td><span class="chipdev">${esc(v.device)}</span>${v.blocked ? ` <span class="badge bad">blocked</span>` : ""}</td><td class="r num">${N(v.queries)}</td></tr>`).join("")}</table>`
      : `<div class="empty">No visits in this range.</div>`}
      <h3 class="t">Addresses</h3>
      <table class="ledger">${d.subdomains.map((s) => `<tr><td class="site">${esc(s.domain)}${s.b ? ` <span class="badge bad">blocked</span>` : ""}</td>
        <td class="r num">${N(s.n)}</td><td class="r"><button class="btn danger" data-block="${esc(s.domain)}" data-scope="exact">Block</button></td></tr>`).join("")}</table>`;
    if (html !== lastSheet) { const b = $("#sheet"), top = b.parentElement.scrollTop; b.innerHTML = html; b.parentElement.scrollTop = top; lastSheet = html; }
  } catch (e) { if (!lastSheet) $("#sheet").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

// ------------------------------------------------------------------ rendering + live polling
let lastView = "", renderSeq = 0;
async function render(force = false) {
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  const seq = ++renderSeq;
  let html;
  try { html = await views[tab](); }
  catch (e) { if (!force && lastView) return; html = `<div class="empty">Couldn't load: ${esc(e.message)}</div>`; }
  if (seq !== renderSeq || (!force && html === lastView)) return;
  const f = $("#filter"), keep = f && { value: f.value, focused: document.activeElement === f, a: f.selectionStart, b: f.selectionEnd };
  const y = window.scrollY;
  $("#view").innerHTML = html; lastView = html;
  const nf = $("#filter");
  if (keep && nf) { nf.value = keep.value; applyFilter(); if (keep.focused) { nf.focus(); nf.setSelectionRange(keep.a, keep.b); } }
  if (!force) window.scrollTo(0, y);
  tween($("#view"));
}
function applyFilter() {
  const q = $("#filter").value.trim().toLowerCase();
  document.querySelectorAll("#sitetable tr[data-site]").forEach((tr) => { tr.style.display = !q || tr.dataset.site.includes(q) ? "" : "none"; });
}
async function refreshStatus() {
  const el = $("#status");
  try {
    const h = await api("/api/health");
    const inc = controls?.incognito;
    if (!h.has_secret) { el.textContent = "Waiting for the Pi-hole app password"; el.className = "status err"; Suite.setLive(false, "No password"); }
    else if (h.last_error) { el.textContent = "Sync problem: " + h.last_error; el.className = "status err"; Suite.setLive(false, "Sync problem"); }
    else if (inc?.on) {
      el.textContent = `Incognito${inc.since ? " since " + fmtWhen(inc.since) : ""}: lookups aren't recorded`; el.className = "status"; Suite.setLive("off", "Incognito");
    } else if (h.last_sync) {
      const s = Math.max(0, Math.round(Date.now() / 1000 - h.last_sync));
      el.textContent = s < 60 ? `Updated ${s}s ago` : `Updated ${ago(h.last_sync)}`; el.className = "status"; Suite.setLive(s < 60);
    } else { el.textContent = "First sync in progress…"; el.className = "status"; }
  } catch { el.textContent = "Can't reach the server"; el.className = "status err"; Suite.setLive(false); }
}
let deviceList = [];
let lanInfo = null;
async function loadNetworks() {
  try {
    lanInfo = await api("/api/lan");
    const sel = $("#wifi"), cur = sel.value || prefs.wifi || "";
    sel.innerHTML = `<option value="">All Wi-Fi networks</option>` + lanInfo.networks.map((n) => `<option>${esc(n)}</option>`).join("");
    sel.hidden = !lanInfo.networks.length;
    if ([...sel.options].some((o) => o.value === cur)) sel.value = cur;
  } catch {}
}
async function loadDevices() {
  try {
    const sel = $("#device"), cur = sel.value || prefs.device || "";
    const devs = await api("/api/devices");
    sel.innerHTML = `<option value="">All devices</option>` + devs.map((d) => `<option>${esc(d)}</option>`).join("");
    if ([...sel.options].some((o) => o.value === cur)) sel.value = cur;
    deviceList = devs;
  } catch {}
}
function setTab(t) { tab = t; savePrefs(); Suite.transition(() => render(true)); }

document.addEventListener("click", (e) => {
  const t = e.target;
  if (t.closest("[data-close]") || t.id === "drawer") return closeSite();
  const b = t.closest("[data-block]"); if (b) { e.stopPropagation(); return block(b.dataset.block, b.dataset.scope || "site", b); }
  const u = t.closest("[data-unblock]"); if (u) return unblock(u.dataset.kind, u.dataset.unblock, u);
  const sw = t.closest("[data-sw]"); if (sw) return flip(sw.dataset.sw, e.detail === 0);  // detail 0: Space or Enter on the switch
  const tb = t.closest("#tabs button"); if (tb) return setTab(tb.dataset.tab);
  const dev = t.closest("[data-device]"); if (dev) { $("#device").value = dev.dataset.device; return setTab("timeline"); }
  const row = t.closest("[data-site]"); if (row) openSite(row.dataset.site);
});
document.addEventListener("input", (e) => { if (e.target.id === "filter") applyFilter(); });
document.addEventListener("keydown", (e) => {
  const typing = /input|textarea|select/i.test(document.activeElement?.tagName || "");
  if (e.key === "Escape" && openSiteName) Suite.instant($("#drawer"), closeSite);  // keyboard: no animation
  if (!typing && !e.ctrlKey && !e.metaKey && /^[1-5]$/.test(e.key) && !document.querySelector("#oracle.open")) setTab(TABS[+e.key - 1]);
});
["#hours", "#device", "#wifi", "#noise"].forEach((s) => $(s).addEventListener("change", () => { savePrefs(); render(true); loadSite(); }));

let polling = false, lastPoll = 0;
async function poll() {
  const every = Number($("#hours").value) > 72 ? 30000 : 5000;
  if (polling || document.hidden || Date.now() - lastPoll < every - 250) return;
  polling = true; lastPoll = Date.now();
  try { await Promise.all([Date.now() - controlsAt > 30000 && loadControls(), refreshStatus(), render(), loadSite()]); } finally { polling = false; }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) { lastPoll = 0; poll(); } });

// ------------------------------------------------------------------ search: tabs, devices, sites, blocking
let siteCache = { t: 0, rows: [] };
Suite.Oracle.register(async (q) => {
  const out = [
    ...TABS.map((t, i) => ({ group: "Network", icon: String(i + 1), title: TAB_NAMES[t], sub: "Open tab", hint: String(i + 1), run: () => setTab(t) })),
    ...[["24", "Last 24 hours"], ["72", "Last 3 days"], ["168", "Last 7 days"], ["720", "Last 30 days"]].map(([h, l]) => ({ group: "Time range", icon: "◷", title: l, keywords: "range period", run: () => { $("#hours").value = h; savePrefs(); render(true); } })),
    ...deviceList.map((d) => ({ group: "Devices", icon: d[0].toUpperCase(), title: `${d} timeline`, sub: "Show only this device", run: () => { $("#device").value = d; setTab("timeline"); } })),
    { group: "Devices", icon: "∗", title: "All devices", run: () => { $("#device").value = ""; savePrefs(); render(true); } },
    ...(controls && !controlsErr ? [
      ...(controls.filter.installed ? [{ group: "Switches", icon: "⊘", title: `Turn ${controls.filter.on ? "off" : "on"} the adult-site filter`, sub: controls.filter.on ? "Every device · asks first" : "Every device", keywords: "adult porn nsfw filter block", run: () => flip("filter", true) }] : []),
      { group: "Switches", icon: "◐", title: `Turn ${controls.incognito.on ? "off" : "on"} Incognito`, sub: controls.incognito.on ? "Record lookups again · asks first" : "Stop recording lookups · asks first", keywords: "incognito private privacy record log", run: () => flip("incognito", true) },
    ] : []),
    ...(lanInfo?.networks || []).map((n) => ({ group: "Wi-Fi network", icon: "≋", title: `Only ${n}`, sub: "Show devices on this Wi-Fi network", run: () => { $("#wifi").value = n; savePrefs(); render(true); } })),
  ];
  if (q.length >= 2) {
    if (Date.now() - siteCache.t > 15000) siteCache = { t: Date.now(), rows: await api("/api/sites?" + qs()) };
    for (const r of siteCache.rows) {
      out.push({ group: "Sites", icon: r.site[0].toUpperCase(), title: r.site, sub: `${N(r.queries)} lookups · ${Object.keys(r.devices).join(", ")}`, run: () => openSite(r.site) });
      out.push({ group: "Block", icon: "⊘", title: `Block ${r.site}`, sub: "Whole site, all devices · asks first", keywords: "block ban deny", run: () => block(r.site, "site") });
    }
    if (/^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(q) && !siteCache.rows.some((r) => r.site === q))
      out.push({ group: "Block", icon: "⊘", title: `Block ${q}`, sub: "Not seen yet · asks first", keywords: "block", run: () => block(q, "site") });
  }
  return out;
});

Suite.mount({ app: "netwatch" });
(async () => {
  await Promise.all([loadDevices(), loadNetworks(), loadControls()]);
  await Promise.all([refreshStatus(), render(true)]);
  lastPoll = Date.now();
  setInterval(poll, 1000);
  setInterval(loadDevices, 300000);
  setInterval(loadNetworks, 60000);
})();
</script>
</body>
</html>
