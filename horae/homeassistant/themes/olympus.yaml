# Olympus theme for Home Assistant: the suite's look (docs/DESIGN.md) in HA's theme variables.
# Light only, like every Olympus site: no `modes:` block, so it stays light whatever the device prefers.
# Install: ./deploy.sh horae-ha, then on horae `sudo bash ~/olympus-ha/ha-theme.sh`.
# Pick it: your profile (bottom left) > Browser settings > Theme > Olympus. For every device at once:
# Developer tools > Actions > frontend.set_theme with `name: Olympus`.
Olympus:
  # ---- type: Inter (loaded by /local/olympus/fonts.js), else the system font
  primary-font-family: "Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
  ha-font-family-body: "var(--primary-font-family)"
  ha-font-family-heading: "var(--primary-font-family)"
  ha-font-family-code: "'JetBrains Mono', ui-monospace, Consolas, monospace"
  paper-font-common-base_-_font-family: "var(--primary-font-family)"
  paper-font-common-code_-_font-family: "'JetBrains Mono', ui-monospace, Consolas, monospace"
  paper-font-body1_-_font-family: "var(--primary-font-family)"
  paper-font-subhead_-_font-family: "var(--primary-font-family)"
  paper-font-headline_-_font-family: "var(--primary-font-family)"
  paper-font-caption_-_font-family: "var(--primary-font-family)"
  paper-font-title_-_font-family: "var(--primary-font-family)"
  mdc-typography-font-family: "var(--primary-font-family)"

  # ---- surfaces: marble page, white cards
  primary-background-color: "#f5f5f2"
  secondary-background-color: "#f9f9f7"
  lovelace-background: "#f5f5f2"
  card-background-color: "#ffffff"
  ha-card-background: "#ffffff"
  clear-background-color: "#ffffff"
  rgb-card-background-color: "255, 255, 255"
  divider-color: "rgba(23, 24, 28, 0.08)"
  outline-color: "rgba(23, 24, 28, 0.15)"
  outline-hover-color: "rgba(23, 24, 28, 0.24)"

  # ---- ink
  primary-text-color: "#17181b"
  secondary-text-color: "#62656c"
  disabled-text-color: "#a6a8ad"
  text-primary-color: "#ffffff"
  rgb-primary-text-color: "23, 24, 28"
  rgb-secondary-text-color: "98, 101, 108"
  rgb-text-primary-color: "255, 255, 255"

  # ---- one accent: Aegean blue (links, toggles, focus); text uses the darker ink step
  primary-color: "#1b5fad"
  dark-primary-color: "#174f91"
  light-primary-color: "#eaf1fb"
  accent-color: "#2a78d6"
  rgb-primary-color: "27, 95, 173"
  rgb-accent-color: "42, 120, 214"
  mdc-theme-primary: "var(--primary-color)"
  mdc-theme-secondary: "var(--accent-color)"
  mdc-theme-on-primary: "#ffffff"
  link-text-color: "#1b5fad"

  # ---- status: the suite's ok / warn / bad
  success-color: "#2f8a57"
  warning-color: "#c4850f"
  error-color: "#c93c37"
  info-color: "#2a78d6"
  rgb-success-color: "47, 138, 87"
  rgb-warning-color: "196, 133, 15"
  rgb-error-color: "201, 60, 55"
  rgb-info-color: "42, 120, 214"

  # ---- states: neutral when off; a light that is on glows sun gold (the one place the sun shows in HA)
  state-icon-color: "#62656c"
  state-active-color: "#1b5fad"
  state-inactive-color: "#a6a8ad"
  state-unavailable-color: "#c4c6ca"
  state-light-active-color: "#d39a1c"
  state-light-on-color: "#d39a1c"
  state-switch-active-color: "#2a78d6"
  state-switch-on-color: "#2a78d6"
  state-fan-active-color: "#2a78d6"
  state-lock-locked-color: "#2f8a57"
  state-lock-unlocked-color: "#c93c37"
  state-lock-jammed-color: "#c93c37"
  state-cover-active-color: "#2a78d6"
  state-media_player-active-color: "#2a78d6"
  state-binary_sensor-active-color: "#c4850f"
  state-climate-heat-color: "#eb6834"
  state-climate-cool-color: "#2a78d6"
  state-climate-auto-color: "#2f8a57"

  # ---- cards: edged by a 1px ring of light and a soft shadow, never a solid border
  ha-card-border-radius: "12px"
  ha-card-border-width: "0px"
  ha-card-border-color: "rgba(23, 24, 28, 0.08)"
  ha-card-box-shadow: "0 0 0 1px rgba(23, 24, 28, 0.07), 0 1px 2px rgba(23, 24, 28, 0.04), 0 2px 8px -2px rgba(23, 24, 28, 0.05)"
  ha-dialog-border-radius: "16px"
  mdc-shape-medium: "12px"
  mdc-shape-small: "8px"
  ha-badge-border-radius: "99px"

  # ---- header and sidebar: the page colour, ink text, no coloured bar
  app-header-background-color: "#f5f5f2"
  app-header-text-color: "#17181b"
  app-header-selection-bar-color: "#17181b"
  app-header-edit-background-color: "#44464c"
  app-header-edit-text-color: "#ffffff"
  sidebar-background-color: "#f5f5f2"
  sidebar-text-color: "#44464c"
  sidebar-icon-color: "#62656c"
  sidebar-selected-text-color: "#17181b"
  sidebar-selected-icon-color: "#17181b"
  sidebar-menu-button-text-color: "#44464c"
  sidebar-menu-button-background-color: "#f5f5f2"

  # ---- controls
  switch-checked-color: "#2a78d6"
  switch-checked-button-color: "#ffffff"
  switch-checked-track-color: "#2a78d6"
  switch-unchecked-button-color: "#ffffff"
  switch-unchecked-track-color: "#a6a8ad"
  slider-color: "#2a78d6"
  slider-track-color: "#efefeb"
  input-fill-color: "#ffffff"
  input-ink-color: "#17181b"
  input-label-ink-color: "#62656c"
  input-idle-line-color: "rgba(23, 24, 28, 0.24)"
  input-hover-line-color: "rgba(23, 24, 28, 0.4)"
  input-disabled-fill-color: "#f9f9f7"
  mdc-text-field-fill-color: "#ffffff"
  mdc-select-fill-color: "#ffffff"
  mdc-checkbox-unchecked-color: "#62656c"
  mdc-radio-unchecked-color: "#62656c"
  scrollbar-thumb-color: "rgba(23, 24, 28, 0.18)"

  # ---- tables, code, tooltips, badges
  table-row-background-color: "#ffffff"
  table-row-alternative-background-color: "#f9f9f7"
  data-table-background-color: "#ffffff"
  code-editor-background-color: "#f9f9f7"
  markdown-code-background-color: "#efefeb"
  label-badge-background-color: "#ffffff"
  label-badge-text-color: "#17181b"
  label-badge-red: "#c93c37"
  label-badge-blue: "#2a78d6"
  label-badge-green: "#2f8a57"
  label-badge-yellow: "#c4850f"
  label-badge-grey: "#62656c"
  paper-tooltip-background: "#17181b"
  paper-tooltip-text-color: "#ffffff"

  # ---- charts (history graphs): the suite's fixed series order, never cycled
  graph-color-1: "#2a78d6"
  graph-color-2: "#eb6834"
  graph-color-3: "#1baf7a"
  graph-color-4: "#eda100"
  graph-color-5: "#e87ba4"
  graph-color-6: "#008300"
  graph-color-7: "#4a3aa7"
  graph-color-8: "#e34948"
  history-unknown-color: "#efefeb"
  history-unavailable-color: "#efefeb"
