# Olympus agent on hephaestus (the tower, when it's booted into Ubuntu). Reports stats/containers to the hub on helios.
#   Start/update:  cd ~/olympus-agent && docker compose up -d     (or ./deploy.sh hephaestus-agent from the PC)
# AMD GPU: load, VRAM, temperature and power are read from /sys/class/drm, so no GPU tools or `gpus:` are needed.
services:
  olympus-agent:
    image: python:3.14-slim
    container_name: olympus-agent
    restart: unless-stopped
    init: true                         # tini as PID 1: stops/restarts take ~1 s, not 10
    network_mode: host                 # sees real client IPs; answers only ALLOW
    command: ["python", "-u", "-B", "/agent/agent.py"]
    environment:
      HOST_NAME: hephaestus
      BIND: 100.102.134.107            # hephaestus' Tailscale IP
      ALLOW: 100.88.170.59             # only the Olympus hub on helios may ask
      DISKS: /
    volumes:
      - ./agent.py:/agent/agent.py:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      - /var/run/docker.sock:/var/run/docker.sock
